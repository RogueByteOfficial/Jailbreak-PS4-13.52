<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RogueByte</title>

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100%;
            overflow: hidden;
            background: #050508;
            background-image:
                radial-gradient(
                    ellipse at 20% 50%,
                    rgba(0, 180, 255, 0.07) 0%,
                    transparent 60%
                ),
                radial-gradient(
                    ellipse at 80% 20%,
                    rgba(120, 0, 255, 0.05) 0%,
                    transparent 50%
                ),
                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(0, 230, 118, 0.04) 0%,
                    transparent 40%
                );
            color: #c8ced8;
            font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.008) 2px,
                    rgba(255, 255, 255, 0.008) 4px
                );
        }

        #brand {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 18px 20px;
            background:
                linear-gradient(
                    180deg,
                    rgba(10, 14, 26, 0.95),
                    rgba(8, 10, 18, 0.9)
                );
            border-bottom: 1px solid rgba(0, 200, 255, 0.1);
        }

        #brand::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 15%;
            right: 15%;
            height: 1px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(0, 229, 255, 0.5),
                    transparent
                );
        }

        #brand img {
            width: 38px;
            height: 38px;
            margin-right: 12px;
            border-radius: 50%;
            vertical-align: middle;
            object-fit: contain;
            border: 2px solid rgba(0, 229, 255, 0.3);
            box-shadow:
                0 0 20px rgba(0, 229, 255, 0.25),
                0 0 6px rgba(0, 229, 255, 0.15);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%,
            100% {
                box-shadow:
                    0 0 20px rgba(0, 229, 255, 0.25),
                    0 0 6px rgba(0, 229, 255, 0.15);
            }

            50% {
                box-shadow:
                    0 0 28px rgba(0, 229, 255, 0.35),
                    0 0 10px rgba(0, 229, 255, 0.2);
            }
        }

        #brand b {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.22em;
            color: #fff;
            vertical-align: middle;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
        }

        #wrap {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 76px);
            padding: 30px 24px;
        }

        #state {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 16px;
            text-align: center;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            animation: fadeSlideUp 0.5s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #det {
            font-size: 14px;
            color: #7b8ba0;
            margin: 0 0 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.035);
            padding: 10px 26px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            animation: fadeSlideUp 0.6s ease-out;
        }

        #det b {
            color: #e0e8f4;
            font-weight: 700;
        }

        #cache {
            font-size: 12px;
            color: #4a5568;
            margin: 10px 0 0;
            min-height: 16px;
            text-align: center;
            letter-spacing: 0.4px;
            transition:
                color 0.3s,
                text-shadow 0.3s;
        }

        #cache.cacheok {
            color: #00e676;
            text-shadow: 0 0 12px rgba(0, 230, 118, 0.3);
        }

        .ok {
            color: #00e676;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.25);
        }

        .bad {
            color: #ff5252;
            text-shadow: 0 0 10px rgba(255, 82, 82, 0.25);
        }

        .warn {
            color: #ffab40;
            text-shadow: 0 0 10px rgba(255, 171, 64, 0.25);
        }
    </style>
</head>

<body>

    <!-- RogueByte branding -->
    <div id="brand">
        <img
            src="logo_RogueByte.png"
            alt="Rogue Byte Logo"
            width="38"
            height="38"
        >
        <b>RAW GAME</b>
    </div>

    <div id="wrap">
        <div id="state">detecting firmware...</div>
        <div id="det"></div>
        <div id="cache"></div>
    </div>

    <script>
        (function () {
            var stateEl = document.getElementById("state");
            var detEl = document.getElementById("det");
            var cacheEl = document.getElementById("cache");

            function setState(t, c) {
                stateEl.textContent = t;
                stateEl.className = c || "";
            }

            function setCache(t, ok) {
                cacheEl.textContent = t;
                cacheEl.className = ok ? "cacheok" : "";
            }

            var params = new URLSearchParams(location.search);

            // Firmwares this build has a MEASURED kernel table for.
            // jb.js still runs its own kernel-table-present gate.
            // This is UX only.
            //
            // KEEP IN SYNC with ps4_offsets.js:
            // add a fwnum here in the SAME commit that fills
            // that firmware's kernel RVAs.
            //
            // The PS4 reports its minor as two hex digits in
            // the UA (13.52 -> minor 0x52).

            var SUPPORTED = {
                1302: 1,
                1304: 1,
                1350: 1,
                1352: 1
            };

            var key = null;
            var fwnum = null;

            var m =
                /PlayStation\s+4[\/ ](\d+)\.(\d+)/
                .exec(navigator.userAgent);

            if (m) {
                var ms = parseInt(m[2], 16).toString(16);

                if (ms.length < 2) {
                    ms = "0" + ms;
                }

                key = m[1] + "." + ms;

                fwnum =
                    parseInt(m[1], 10) * 100 +
                    parseInt(ms, 10);
            }

            var forced = params.get("force") === "1";

            var supported =
                forced ||
                (
                    fwnum !== null &&
                    SUPPORTED[fwnum] === 1
                );

            detEl.innerHTML =
                "firmware <b>" +
                (key || "unknown") +
                "</b>" +
                (
                    supported
                        ? " &middot; <b>supported</b>"
                        : " &middot; not in this build's kernel table"
                );

            var target = "jb.html" + location.search;

            function go() {
                setState(
                    "loading jailbreak...",
                    "warn"
                );

                location.replace(target);
            }

            function waitForTap(msg, action) {
                setState(msg, "warn");

                function fire() {
                    window.removeEventListener(
                        "click",
                        fire
                    );

                    window.removeEventListener(
                        "keydown",
                        fire
                    );

                    action();
                }

                window.addEventListener(
                    "click",
                    fire
                );

                window.addEventListener(
                    "keydown",
                    fire
                );
            }

            // Off-target consoles are not launched automatically.
            // One tap still runs it, so a user-agent quirk on the
            // real 13.52 console can never lock it out.

            if (!supported) {
                setState(
                    "UNSUPPORTED FIRMWARE",
                    "bad"
                );

                waitForTap(
                    "UNSUPPORTED (" +
                    (key || "unknown") +
                    ") -- press X or tap to run anyway",
                    go
                );

                return;
            }

            var ac = window.applicationCache;

            if (
                !ac ||
                !document.documentElement.hasAttribute("manifest")
            ) {
                go();

            } else if (!navigator.onLine) {
                setCache(
                    "offline -- from cache",
                    true
                );

                go();

            } else if (ac.status === ac.IDLE) {
                setCache(
                    "cached",
                    true
                );

                go();

            } else if (ac.status === ac.UPDATEREADY) {
                try {
                    ac.swapCache();
                } catch (e) {}

                setCache(
                    "update downloaded",
                    true
                );

                waitForTap(
                    "UPDATE READY -- press X or tap to reload & run",
                    function () {
                        location.reload();
                    }
                );

            } else {
                setCache(
                    "checking cache..."
                );

                ac.addEventListener(
                    "downloading",
                    function () {
                        setCache(
                            "caching for offline (first run)..."
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "progress",
                    function (e) {
                        if (e && e.total) {
                            setCache(
                                "caching " +
                                Math.round(
                                    (e.loaded / e.total) * 100
                                ) +
                                "%"
                            );
                        }
                    },
                    false
                );

                ac.addEventListener(
                    "cached",
                    function () {
                        setCache(
                            "cached for offline use",
                            true
                        );

                        waitForTap(
                            "CACHED (first run) -- press X or tap to run",
                            go
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "updateready",
                    function () {
                        try {
                            ac.swapCache();
                        } catch (e) {}

                        setCache(
                            "update downloaded",
                            true
                        );

                        waitForTap(
                            "UPDATE READY -- press X or tap to reload & run",
                            function () {
                                location.reload();
                            }
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "noupdate",
                    function () {
                        setCache(
                            "cached -- offline ready",
                            true
                        );

                        go();
                    },
                    false
                );

                ac.addEventListener(
                    "error",
                    function () {
                        setCache(
                            "cache unavailable"
                        );

                        waitForTap(
                            "CACHE FAILED -- press X or tap to run anyway",
                            go
                        );
                    },
                    false
                );

                ac.addEventListener(
                    "obsolete",
                    function () {
                        setCache(
                            "cache obsolete"
                        );

                        waitForTap(
                            "CACHE OBSOLETE -- press X or tap to run",
                            go
                        );
                    },
                    false
                );
            }

        })();
    </script>

</body>

</html>
